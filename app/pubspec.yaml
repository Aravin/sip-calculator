name: sip_calculator
description: Comprehensive SIP, Lumpsum, SWP, STP, PPF & EMI financial calculator with Monte Carlo simulation, AI insights, step-up SIP, goal mode, LTCG tax, inflation adjustment, NRI currency mode, CSV export, and dark mode.

publish_to: 'none'

version: 5.2.0+32

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  velocity_x: ^4.3.1
  share_plus: ^9.0.0
  in_app_review: ^2.0.12
  google_mobile_ads: ^5.3.1
  fl_chart: ^0.69.2
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  fonts:
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-Italic.ttf
          style: italic
        - asset: assets/fonts/IBM_Plex_Mono/IBMPlexMono-Bold.ttf
          weight: 700
